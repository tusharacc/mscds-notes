<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Python Core &amp; Applied Concepts — MCQ Practice Quiz. MScDS IIIT Hyderabad.">
<title>Python Quiz — MCQ Practice</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue-border: #2563eb;   --blue-bg: #eef4ff;   --blue-badge: #1d4ed8;
  --amber-border: #d97706;  --amber-bg: #fefce8;  --amber-badge: #92400e;
  --green-border: #16a34a;  --green-bg: #f0fdf4;  --green-badge: #14532d;
  --violet-border: #7c3aed; --violet-bg: #f5f3ff; --violet-badge: #5b21b6;
  --grey-border: #78716c;   --grey-bg: #faf9f7;   --grey-badge: #44403c;
  --page-bg: #faf6ef;
  --surface: #fffdf9;
  --border: #e5d9c8;
  --text: #1c1410;
  --text-muted: #6b5f54;
  --gold: #92400e;
  --radius: 10px;
  --shadow-sm: 0 1px 3px rgba(28,20,16,.06), 0 1px 2px rgba(28,20,16,.04);
  --shadow-md: 0 4px 14px rgba(28,20,16,.10), 0 2px 4px rgba(28,20,16,.06);
  --correct: #16a34a;
  --correct-bg: #f0fdf4;
  --wrong: #dc2626;
  --wrong-bg: #fef2f2;
  --code-bg: #1e1a16;
  --code-border: #3d3028;
}

html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: 'Lora', Georgia, serif;
  background: var(--page-bg);
  color: var(--text);
  line-height: 1.8;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1.2rem 4rem;
}

/* ── Page header ── */
.page-header {
  width: 100%; max-width: 700px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 2.5rem;
  padding-bottom: 1.2rem;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.page-header::after {
  content: '';
  position: absolute; bottom: -3px; left: 0;
  width: 3rem; height: 3px;
  background: var(--gold); border-radius: 2px;
}
.page-header h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.9rem; font-weight: 800; line-height: 1.2;
}
.page-header .back-link {
  font-size: .8rem; color: var(--text-muted); text-decoration: none;
  display: flex; align-items: center; gap: .3rem;
  transition: color .2s;
  white-space: nowrap;
}
.page-header .back-link:hover { color: var(--gold); }

/* ── Quiz card ── */
#quiz-root {
  width: 100%; max-width: 700px;
}

/* ── Start screen ── */
.start-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2.5rem 2rem;
  text-align: center;
  box-shadow: var(--shadow-md);
}
.start-card .quiz-icon {
  font-size: 2.8rem; margin-bottom: 1rem;
}
.start-card h2 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.6rem; font-weight: 700; margin-bottom: .5rem;
}
.start-card .desc {
  color: var(--text-muted); font-size: .9rem; margin-bottom: 1.8rem; line-height: 1.6;
}
.week-pills {
  display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem;
  margin-bottom: 1.8rem;
}
.week-pill {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: .65rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase;
  background: var(--amber-bg); color: var(--amber-badge);
  border: 1px solid #fde68a; border-radius: 999px;
  padding: .2rem .7rem;
}

/* ── Buttons ── */
.btn {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 700; font-size: .88rem; letter-spacing: .04em;
  border: none; border-radius: 8px; cursor: pointer;
  padding: .75rem 2rem;
  transition: transform .15s, box-shadow .15s, background .15s;
}
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.btn-primary {
  background: var(--gold); color: #fff;
  box-shadow: 0 2px 8px rgba(146,64,14,.3);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(146,64,14,.4); }
.btn-primary:active { transform: translateY(0); }
.btn-secondary {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.btn-secondary:hover { border-color: var(--gold); color: var(--gold); }

/* ── Question card ── */
.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  box-shadow: var(--shadow-md);
}

/* Progress */
.q-progress {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.4rem;
}
.q-progress-label {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: .7rem; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--text-muted);
}
.q-dots { display: flex; gap: .4rem; }
.q-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border); transition: background .25s;
}
.q-dot.filled { background: var(--gold); }
.q-dot.correct { background: var(--correct); }
.q-dot.wrong { background: var(--wrong); }

/* Week badge */
.q-week-badge {
  display: inline-block;
  font-family: 'Playfair Display', Georgia, serif;
  font-size: .62rem; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase;
  background: var(--violet-bg); color: var(--violet-badge);
  border: 1px solid #ddd6fe; border-radius: 999px;
  padding: .18rem .65rem; margin-bottom: .9rem;
}

/* Question text */
.q-text {
  font-size: 1.05rem; font-weight: 500; line-height: 1.65;
  margin-bottom: 1.4rem;
}
.q-text code {
  font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
  font-size: .84em; background: rgba(28,20,16,.07);
  padding: .1em .35em; border-radius: 3px; color: #6b3e1f;
}

/* Code block inside question */
.q-code {
  margin: .6rem 0 1rem;
  border-radius: 10px; overflow: hidden;
  box-shadow: 0 2px 8px rgba(28,20,16,.14);
}
.q-code pre {
  background: var(--code-bg); color: #d4c5b0;
  font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
  font-size: .8rem; line-height: 1.7;
  padding: .9rem 1.1rem; margin: 0;
  overflow-x: auto; tab-size: 4;
}
.q-code pre .kw  { color: #e06c75; }
.q-code pre .fn  { color: #61afef; }
.q-code pre .st  { color: #98c379; }
.q-code pre .cm  { color: #7a6a58; font-style: italic; }
.q-code pre .nu  { color: #d19a66; }
.q-code pre .op  { color: #c6a0f6; }

/* Options */
.options { display: flex; flex-direction: column; gap: .65rem; margin-bottom: 1.4rem; }
.option-btn {
  display: flex; align-items: flex-start; gap: .75rem;
  width: 100%; text-align: left;
  background: var(--page-bg); border: 1.5px solid var(--border);
  border-radius: 10px; padding: .75rem 1rem;
  font-family: 'Lora', Georgia, serif; font-size: .9rem;
  color: var(--text); cursor: pointer;
  transition: border-color .18s, background .18s, transform .12s;
}
.option-btn:hover:not(:disabled) {
  border-color: var(--gold); background: var(--amber-bg);
  transform: translateX(3px);
}
.option-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.option-btn.selected:not(.revealed) {
  border-color: var(--gold); background: var(--amber-bg);
}
.option-btn .opt-label {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 700; font-size: .78rem; letter-spacing: .06em;
  min-width: 1.4rem; color: var(--text-muted);
  flex-shrink: 0; margin-top: .08rem;
}
.option-btn code {
  font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
  font-size: .82em; background: rgba(28,20,16,.07);
  padding: .1em .3em; border-radius: 3px; color: #6b3e1f;
}

/* Revealed states */
.option-btn.correct-ans {
  border-color: var(--correct); background: var(--correct-bg);
  color: #14532d;
}
.option-btn.correct-ans .opt-label { color: var(--correct); }
.option-btn.wrong-ans {
  border-color: var(--wrong); background: var(--wrong-bg);
  color: #7f1d1d;
}
.option-btn.wrong-ans .opt-label { color: var(--wrong); }
.option-btn:disabled { cursor: default; transform: none; }

/* Submit row */
.submit-row {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
}
.submit-row .hint {
  font-size: .78rem; color: var(--text-muted); font-style: italic;
}

/* Explanation */
.explanation {
  margin-top: 1.2rem;
  background: var(--amber-bg);
  border-left: 4px solid var(--amber-border);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: .9rem 1.1rem;
  font-size: .9rem; line-height: 1.7;
  animation: fadeUp .3s ease both;
}
.explanation .exp-label {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: .62rem; font-weight: 700; letter-spacing: .13em;
  text-transform: uppercase; color: var(--amber-badge);
  margin-bottom: .35rem;
}
.explanation code {
  font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
  font-size: .83em; background: rgba(28,20,16,.07);
  padding: .1em .3em; border-radius: 3px; color: #6b3e1f;
}

/* Result badge */
.result-badge {
  display: inline-flex; align-items: center; gap: .4rem;
  font-family: 'Playfair Display', Georgia, serif;
  font-size: .72rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; padding: .3rem .8rem;
  border-radius: 999px; margin-bottom: .8rem;
}
.result-badge.correct { background: var(--correct-bg); color: var(--correct); border: 1px solid #bbf7d0; }
.result-badge.wrong   { background: var(--wrong-bg);   color: var(--wrong);   border: 1px solid #fecaca; }

/* ── Summary screen ── */
.summary-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  box-shadow: var(--shadow-md);
}
.summary-score {
  text-align: center;
  padding: 1.5rem 0 1.8rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.5rem;
}
.score-ring {
  width: 90px; height: 90px; border-radius: 50%;
  border: 5px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto .9rem;
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.5rem; font-weight: 800; color: var(--gold);
}
.summary-score h2 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.3rem; font-weight: 700; margin-bottom: .3rem;
}
.summary-score .score-msg {
  font-size: .88rem; color: var(--text-muted); font-style: italic;
}
.summary-breakdown { display: flex; flex-direction: column; gap: .7rem; margin-bottom: 1.8rem; }
.breakdown-item {
  display: flex; align-items: flex-start; gap: .75rem;
  padding: .75rem 1rem;
  border-radius: 10px; border: 1px solid var(--border);
  font-size: .88rem; line-height: 1.55;
}
.breakdown-item.pass { background: var(--correct-bg); border-color: #bbf7d0; }
.breakdown-item.fail { background: var(--wrong-bg);   border-color: #fecaca; }
.breakdown-icon { font-size: 1rem; flex-shrink: 0; margin-top: .1rem; }
.breakdown-item .bd-q { font-weight: 600; margin-bottom: .2rem; }
.breakdown-item .bd-ans { font-size: .82rem; color: var(--text-muted); }
.breakdown-item .bd-ans code {
  font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
  font-size: .82em; background: rgba(28,20,16,.07);
  padding: .1em .3em; border-radius: 3px; color: #6b3e1f;
}
.summary-actions {
  display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap;
}

/* ── Animations ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.q-card { animation: fadeUp .35s ease both; }
.summary-card { animation: fadeUp .35s ease both; }

/* ── Responsive ── */
@media (max-width: 600px) {
  body { padding: 1.2rem .8rem 3rem; }
  .page-header h1 { font-size: 1.4rem; }
  .q-card, .start-card, .summary-card { padding: 1.4rem 1.1rem; }
  .submit-row { flex-direction: column; align-items: stretch; }
  .submit-row .hint { display: none; }
}
</style>
</head>

<div id="quiz-root"></div>

<script>
(function () {
'use strict';

/* ═══════════════════════════════════════════════════════════
   QUESTION BANK  (94 questions, Weeks 1–10)
   ═══════════════════════════════════════════════════════════ */
const QUESTIONS = [

  /* ── WEEK 1 · Python Foundations (12 questions) ─────────── */
  {
    week: 1,
    q: 'What is the primary purpose of a high-level programming language like Python?',
    options: [
      'To write instructions that map directly to CPU machine code',
      'To provide an abstraction layer so programmers reason about <em>what</em> to compute, not how hardware computes it',
      'To prevent the programmer from making runtime errors',
      'To compile programs into binary before execution'
    ],
    answer: 'To provide an abstraction layer so programmers reason about <em>what</em> to compute, not how hardware computes it',
    explanation: 'High-level languages abstract hardware details. One Python statement may generate dozens of machine instructions — the language implementation (interpreter/compiler) handles the translation, freeing the programmer to think about logic rather than registers.'
  },
  {
    week: 1,
    q: 'Which type of programming error is the hardest to detect?',
    options: [
      'Syntax error — caught before the program runs',
      'Runtime error — program crashes with an exception',
      'Semantic error — program runs without crashing but produces wrong results',
      'Import error — a required module is missing'
    ],
    answer: 'Semantic error — program runs without crashing but produces wrong results',
    explanation: 'Semantic errors are silent. The interpreter never complains — the program happily returns incorrect output. Detecting them requires reasoning about the specification and comparing intended vs actual behaviour, which is entirely the programmer\'s responsibility.'
  },
  {
    week: 1,
    q: 'What does Python\'s <code>id()</code> function return?',
    options: [
      'The value stored in a variable',
      'A unique integer identity of an object (its memory address in CPython)',
      'The type name of an object as a string',
      'The reference count of an object'
    ],
    answer: 'A unique integer identity of an object (its memory address in CPython)',
    explanation: '<code>id(x)</code> returns an integer that is unique and constant for the object\'s lifetime. In the CPython implementation this happens to be the memory address, but that is an implementation detail — the guarantee is only uniqueness and constancy during the object\'s lifetime.'
  },
  {
    week: 1,
    q: 'Python is described as "strongly typed." What does this mean?',
    options: [
      'Every variable must be declared with a type before use',
      'Python never implicitly converts one type to another to satisfy an operation',
      'Python only allows one type per variable throughout the program',
      'Type hints are mandatory and enforced at runtime'
    ],
    answer: 'Python never implicitly converts one type to another to satisfy an operation',
    explanation: 'Strong typing means <code>"hello" + 5</code> raises a <code>TypeError</code> rather than silently coercing <code>5</code> to <code>"5"</code> (as JavaScript would). You must explicitly convert: <code>"hello" + str(5)</code>. This surfaces type mismatches as explicit errors.'
  },
  {
    week: 1,
    q: 'What will <code>"hello" + 5</code> produce in Python?',
    options: [
      '<code>"hello5"</code>',
      '<code>TypeError</code>',
      '<code>SyntaxError</code>',
      '<code>"hello 5"</code>'
    ],
    answer: '<code>TypeError</code>',
    explanation: 'Python is strongly typed and refuses to implicitly coerce an <code>int</code> to a <code>str</code>. The correct approach is explicit conversion: <code>"hello" + str(5)</code>.'
  },
  {
    week: 1,
    q: 'Which statement about Python type hints (PEP 484) is correct?',
    options: [
      'Type hints are enforced at runtime and raise errors when violated',
      'Type hints are optional annotations ignored at runtime, used by static analysers and IDEs',
      'Type hints replace dynamic typing and make Python statically typed',
      'Type hints can only be applied to function parameters, not return values'
    ],
    answer: 'Type hints are optional annotations ignored at runtime, used by static analysers and IDEs',
    explanation: 'PEP 484 type hints are purely advisory. Python\'s runtime does not check them — the interpreter runs code regardless. Static tools like mypy or Pyright read hints to surface potential type errors before runtime, bridging dynamic Python with the safety of static typing.'
  },
  {
    week: 1,
    q: 'What happens when you write <code>b = a</code> where <code>a</code> is a list?',
    options: [
      'A new independent copy of the list is created and assigned to <code>b</code>',
      '<code>b</code> becomes an alias — both <code>a</code> and <code>b</code> refer to the same list object',
      'Python raises an error because lists cannot be assigned to multiple variables',
      '<code>b</code> receives a shallow copy of <code>a</code>'
    ],
    answer: '<code>b</code> becomes an alias — both <code>a</code> and <code>b</code> refer to the same list object',
    explanation: 'In Python, assignment copies the reference, not the object. After <code>b = a</code>, <code>a is b</code> is <code>True</code> — they point to the identical list. Mutating through <code>b</code> is visible through <code>a</code> and vice versa.'
  },
  {
    week: 1,
    q: 'What is the Zen of Python (PEP 20) principle most directly concerned with code readability?',
    options: [
      'Errors should never pass silently',
      'Readability counts',
      'Simple is better than complex',
      'There should be one obvious way to do it'
    ],
    answer: 'Readability counts',
    explanation: '"Readability counts" directly states that code is written once but read many times. Python\'s design consistently prioritises clarity — enforced indentation, meaningful keywords, and a clean syntax all stem from this principle.'
  },
  {
    week: 1,
    q: 'Python uses approximately how much more energy than equivalent C code according to benchmark studies?',
    options: [
      '2×',
      '10×',
      '76×',
      '500×'
    ],
    answer: '76×',
    explanation: 'Benchmark studies comparing energy usage across programming languages show Python consuming roughly 76 times more energy than C for equivalent computations. This is a significant disadvantage for large-scale or power-constrained workloads, driving use of Numba, Cython, or C extensions in performance-critical paths.'
  },
  {
    week: 1,
    q: 'Which of the following is NOT a valid Python variable name?',
    options: [
      '<code>_private_var</code>',
      '<code>CamelCase</code>',
      '<code>return</code>',
      '<code>score2</code>'
    ],
    answer: '<code>return</code>',
    explanation: '<code>return</code> is one of Python\'s 35 reserved keywords and cannot be used as an identifier. Reserved keywords have special syntactic roles and the parser will raise a <code>SyntaxError</code> if you try to assign to one.'
  },
  {
    week: 1,
    q: 'Python is described as "dynamically typed." Which behaviour demonstrates this?',
    options: [
      'Variables must be declared with a type annotation before use',
      'The type of a variable is fixed at the time it is first assigned and cannot change',
      'A variable can be rebound to an object of a completely different type at any time',
      'Python checks types at compile time before running the program'
    ],
    answer: 'A variable can be rebound to an object of a completely different type at any time',
    explanation: 'In Python, type lives with the object, not the variable. After <code>x = 42</code>, you can write <code>x = "hello"</code> — <code>x</code> now refers to a string object. There is no type declaration; the interpreter simply updates the binding.'
  },
  {
    week: 1,
    q: 'What is CPython?',
    options: [
      'A Python library for C interoperability',
      'The reference implementation of Python, written in C',
      'A just-in-time compiler for Python',
      'A static type checker for Python'
    ],
    answer: 'The reference implementation of Python, written in C',
    explanation: 'CPython is the standard, canonical Python interpreter maintained by the Python Software Foundation. It defines Python\'s observable semantics. Other implementations (PyPy, Jython, MicroPython) must match CPython\'s behaviour to be considered compliant Python.'
  },

  /* ── WEEK 2 · Expressions & Anonymous Functions (8 questions) ── */
  {
    week: 2,
    q: 'What distinguishes the walrus operator <code>:=</code> from the assignment operator <code>=</code>?',
    options: [
      '<code>:=</code> creates immutable bindings; <code>=</code> creates mutable ones',
      '<code>:=</code> is an expression (has a value); <code>=</code> is a statement (has no value)',
      '<code>:=</code> only works inside function bodies; <code>=</code> works anywhere',
      '<code>:=</code> performs deep copy; <code>=</code> performs shallow copy'
    ],
    answer: '<code>:=</code> is an expression (has a value); <code>=</code> is a statement (has no value)',
    explanation: 'The walrus operator both assigns and evaluates to the assigned value, so it can be embedded inside conditions, comprehensions, and other expressions. Regular <code>=</code> is a statement — it performs an action but cannot appear where a value is expected (e.g., <code>result = (x = 5)</code> is a <code>SyntaxError</code>).'
  },
  {
    week: 2,
    q: 'What does <code>result = (x := 5)</code> do?',
    options: [
      'Raises a SyntaxError',
      'Assigns 5 to <code>x</code>, then assigns <code>x</code>\'s value (5) to <code>result</code>',
      'Assigns 5 to <code>result</code> only; <code>x</code> is not changed',
      'Creates a tuple <code>(x, 5)</code> and assigns it to <code>result</code>'
    ],
    answer: 'Assigns 5 to <code>x</code>, then assigns <code>x</code>\'s value (5) to <code>result</code>',
    explanation: 'The walrus expression <code>x := 5</code> assigns 5 to <code>x</code> and evaluates to 5. The outer assignment then binds <code>result</code> to that value. After this line, both <code>x</code> and <code>result</code> equal 5.'
  },
  {
    week: 2,
    q: 'What is the result of <code>7 // 2</code> in Python?',
    options: [
      '<code>3.5</code>',
      '<code>3</code>',
      '<code>4</code>',
      '<code>3.0</code>'

/* ═══════════════════════════════════════════════════════════
   UTILITY FUNCTIONS
   ═══════════════════════════════════════════════════════════ */

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickSession(bank, n) {
  const shuffled = shuffle(bank);
  return shuffled.slice(0, Math.min(n, shuffled.length)).map(q => {
    const opts = shuffle(q.options);
    return { ...q, options: opts };
  });
}

function scoreMsg(n, total) {
  const pct = n / total;
  if (pct === 1)   return 'Perfect score! Outstanding work.';
  if (pct >= 0.8)  return 'Excellent — you have a strong grasp of the material.';
  if (pct >= 0.6)  return 'Good effort. Review the explanations for the ones you missed.';
  return 'Keep studying — re-read the relevant sections and try again.';
}

const LABELS = ['A', 'B', 'C', 'D'];

/* ═══════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════ */
let session = [];
let current = 0;
let answers = [];   // { chosen, correct }[]

const root = document.getElementById('quiz-root');

/* ═══════════════════════════════════════════════════════════
   RENDERERS
   ═══════════════════════════════════════════════════════════ */

function renderStart() {
  const weekSet = [...new Set(QUESTIONS.map(q => q.week))].sort((a,b)=>a-b);
  root.innerHTML = `
    <div class="start-card">
      <div class="quiz-icon">📝</div>
      <h2>Python Course MCQ Quiz</h2>
      <p class="desc">
        ${QUESTIONS.length} questions across all 10 weeks.<br>
        Each session picks <strong>5 random questions</strong>.<br>
        You'll see the explanation after every answer.
      </p>
      <div class="week-pills">
        ${weekSet.map(w => `<span class="week-pill">Week ${w}</span>`).join('')}
      </div>
      <button class="btn btn-primary" id="start-btn">Start Quiz</button>
    </div>`;
  document.getElementById('start-btn').addEventListener('click', startQuiz);
}

function renderQuestion() {
  const q = session[current];
  const dots = session.map((_, i) => {
    let cls = 'q-dot';
    if (i < current) cls += answers[i].chosen === answers[i].correct ? ' correct' : ' wrong';
    else if (i === current) cls += ' filled';
    return `<div class="${cls}"></div>`;
  }).join('');

  root.innerHTML = `
    <div class="q-card">
      <div class="q-progress">
        <span class="q-progress-label">Question ${current + 1} of ${session.length}</span>
        <div class="q-dots">${dots}</div>
      </div>
      <span class="q-week-badge">Week ${q.week}</span>
      <p class="q-text">${q.q}</p>
      <div class="options" id="options">
        ${q.options.map((opt, i) => `
          <button class="option-btn" data-idx="${i}">
            <span class="opt-label">${LABELS[i]}</span>
            <span>${opt}</span>
          </button>`).join('')}
      </div>
      <div class="submit-row">
        <span class="hint">Select an answer, then submit</span>
        <button class="btn btn-primary" id="submit-btn" disabled>Submit Answer</button>
      </div>
    </div>`;

  let selected = null;

  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selected = parseInt(btn.dataset.idx);
      document.getElementById('submit-btn').disabled = false;
    });
  });

  document.getElementById('submit-btn').addEventListener('click', () => {
    if (selected === null) return;
    submitAnswer(selected);
  });
}

function submitAnswer(chosenIdx) {
  const q = session[current];
  const correct = q.answer;
  const chosen  = q.options[chosenIdx];
  answers.push({ chosen, correct });

  const isCorrect = chosen === correct;
  const correctIdx = q.options.indexOf(correct);

  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.disabled = true;
    btn.classList.add('revealed');
    btn.classList.remove('selected');
    if (i === correctIdx) btn.classList.add('correct-ans');
    else if (i === chosenIdx && !isCorrect) btn.classList.add('wrong-ans');
  });

  const badge = isCorrect
    ? '<span class="result-badge correct">✓ Correct</span>'
    : '<span class="result-badge wrong">✗ Incorrect</span>';

  const expDiv = document.createElement('div');
  expDiv.innerHTML = `
    ${badge}
    <div class="explanation">
      <div class="exp-label">Explanation</div>
      ${q.explanation}
    </div>
    <div style="text-align:right;margin-top:1rem">
      <button class="btn btn-primary" id="next-btn">
        ${current < session.length - 1 ? 'Next Question →' : 'See Results'}
      </button>
    </div>`;

  document.querySelector('.q-card').appendChild(expDiv);
  document.querySelector('.submit-row').style.display = 'none';

  document.getElementById('next-btn').addEventListener('click', () => {
    current++;
    if (current < session.length) renderQuestion();
    else renderSummary();
  });
}

function renderSummary() {
  const total   = session.length;
  const correct = answers.filter(a => a.chosen === a.correct).length;

  const breakdown = session.map((q, i) => {
    const pass = answers[i].chosen === answers[i].correct;
    return `
      <div class="breakdown-item ${pass ? 'pass' : 'fail'}">
        <div class="breakdown-icon">${pass ? '✓' : '✗'}</div>
        <div>
          <div class="bd-q">Q${i+1} (Week ${q.week}) — ${pass ? 'Correct' : 'Incorrect'}</div>
          <div class="bd-ans">${q.q.replace(/<[^>]+>/g,'').substring(0,80)}…</div>
          ${!pass ? `<div class="bd-ans" style="margin-top:.2rem">Correct: <code>${answers[i].correct.replace(/<[^>]+>/g,'')}</code></div>` : ''}
        </div>
      </div>`;
  }).join('');

  root.innerHTML = `
    <div class="summary-card">
      <div class="summary-score">
        <div class="score-ring">${correct}/${total}</div>
        <h2>${scoreMsg(correct, total)}</h2>
        <p class="score-msg">${correct} correct out of ${total} questions</p>
      </div>
      <div class="summary-breakdown">${breakdown}</div>
      <div class="summary-actions">
        <button class="btn btn-primary" id="retake-btn">Retake Quiz</button>
        <a class="btn btn-secondary" href="../index.html">← Back to Notes</a>
      </div>
    </div>`;

  document.getElementById('retake-btn').addEventListener('click', startQuiz);
}

/* ═══════════════════════════════════════════════════════════
   ENTRY POINT
   ═══════════════════════════════════════════════════════════ */

function startQuiz() {
  session = pickSession(QUESTIONS, 5);
  current = 0;
  answers = [];
  renderQuestion();
}

renderStart();

})();
</script>
